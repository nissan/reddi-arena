# Reddi Arena — canonical execution graph (graph-v1)
# Migrated from plan/backlog.yaml by tools/plan_to_graph.py (node GE01).
# This file is now the source of truth for scheduling and status.
# plan/backlog.yaml is retained as the superseded fuller design and still
# backs the generated spdd/ prompt artifacts (binding per-node context).
# Lint: python3 tools/graph_lint.py   Rules: planning/prompts/00-bootstrap.md
# Do not record volatile GitHub state (PR numbers, worktrees, CI) here.
version: graph-v1
project: reddi-arena
defaultBranch: main
policies:
  oneIssuePerExecutableNode: true
  oneWorktreePerClaimedNode: true
  onePrimaryPRPerNode: true
  requireLinearHistory: true
  preferredMerge: rebase
  requireRetrospective: true
  doneRequiresEvidence: true
  maxParallelNodes: 2
nodeTypes:
- discovery
- decision
- design
- implementation
- verification
- documentation
- release
statuses:
- ready
- blocked
- parked
- cancelled
- done
nodes:
- id: A1
  type: implementation
  title: Validate reference ADL documents against the published v0.2 schema
  status: done
  objective: The reference bots were drafted from prose, not from the schema. Until validated
    they are hypotheses, not artifacts.
  epic: E01
  lane: SL-A
  phase: P0
  parent: null
  dependsOn: []
  acceptance:
  - Both reference ADL documents validate with zero schema errors
  - The pinned schema hash is recorded and checked in CI
  - Every drift correction has a one-line changelog entry citing the schema path
  tests:
  - id: T-001
    command: python3 tools/validate_adl.py && python3 tests/test_arena.py
  - id: T-002
    command: python3 tools/validate_adl.py && python3 tests/test_arena.py
  evidence:
    required:
    - test-output
    - pr-review
    - spdd artifact (spdd/prompt/*-a1-*.md) Sync Log updated
    recorded:
    - tools/validate_adl.py — both reference documents 0 errors against pinned schema 679a5c3e...;
      15 drift corrections and 5 findings logged in docs/FINDINGS.md; F-001 charge-intent
      gap reproduced as a schema-valid negative fixture.
  boundary: Validation proves document shape only. It authorizes no execution.
  surfaces:
    allow: &id001
    - adl/
    - fixtures/
    - vendor/
    - tools/
    - docs/
    - tests/
    deny:
    - artifacts/
  humanGate: false
